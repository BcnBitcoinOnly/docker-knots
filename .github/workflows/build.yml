name: Build Bitcoin Knots images

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build.yml"
      - "Dockerfile"
      - "docker-bake.hcl"
      - "signet-miner-entrypoint.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build v${{ matrix.version }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - "ubuntu-26.04"
          - "ubuntu-26.04-arm"
        version:
          - "29.1.knots20250903"
          - "29.2.knots20251010"
          - "29.2.knots20251110"
          - "29.3.knots20260210"
          - "29.3.knots20260507"
    env:
      RUNNER: ${{ matrix.runner }}
      VERSION: ${{ matrix.version }}
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          provenance: false
          push: true
          sbom: false
          targets: knots

  merge:
    name: Merge v${{ matrix.version }}
    runs-on: ubuntu-latest
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        version:
          - "29.1.knots20250903"
          - "29.2.knots20251010"
          - "29.2.knots20251110"
          - "29.3.knots20260210"
          - "29.3.knots20260507"
    env:
      LATEST_VERSION: "29.3.knots20260507"
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: 1maa
          password: ${{ secrets.DOCKER_HUB_PASS }}
      - run: |
          docker buildx imagetools create \
            -t 1maa/bitcoin:v${{ matrix.version }} \
            ghcr.io/bcnbitcoinonly/bitcoin:v${{ matrix.version }}-ARM64 \
            ghcr.io/bcnbitcoinonly/bitcoin:v${{ matrix.version }}-X64
      - if: ${{ matrix.version == env.LATEST_VERSION }}
        run: |
          docker buildx imagetools create \
            -t 1maa/bitcoin:latest \
            1maa/bitcoin:v${{ matrix.version }}

  cleanup:
    name: Cleanup old GHCR tags
    runs-on: ubuntu-latest
    needs:
      - merge
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: bitcoin
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0

  miner:
    name: Build signet miner image from latest Knots version
    runs-on: ubuntu-latest
    needs:
      - merge
    steps:
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: 1maa
          password: ${{ secrets.DOCKER_HUB_PASS }}
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          provenance: false
          push: true
          sbom: false
          targets: miner
