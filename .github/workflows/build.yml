name: Build Bitcoin Knots images

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build v${{ matrix.knots.version }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        knots:
          - { version: "27.1.knots20240801", context: "autotools" }
          - { version: "28.1.knots20250305", context: "autotools" }
          - { version: "29.1.knots20250903", context: "cmake" }
          - { version: "29.2.knots20251010", context: "cmake" }
          - { version: "29.2.knots20251110", context: "cmake" }
          - { version: "29.3.knots20260210", context: "cmake" }
          - { version: "29.3.knots20260507", context: "cmake" }
        runner:
          - "ubuntu-26.04"
          - "ubuntu-26.04-arm"
    env:
      CONTEXT: ${{ matrix.knots.context }}
      RUNNER: ${{ matrix.runner }}
      VERSION: ${{ matrix.knots.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          provenance: false
          push: true
          sbom: false
          targets: knots

  build-bip110:
    name: Build latest BIP-110 ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - "ubuntu-26.04"
          - "ubuntu-26.04-arm"
    env:
      RUNNER: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          provenance: false
          push: true
          sbom: false
          targets: bip110

  merge:
    name: Merge v${{ matrix.knots_version }}
    runs-on: ubuntu-latest
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        knots_version:
          - "27.1.knots20240801"
          - "28.1.knots20250305"
          - "29.1.knots20250903"
          - "29.2.knots20251010"
          - "29.2.knots20251110"
          - "29.3.knots20260210"
          - "29.3.knots20260507"
    env:
      LATEST_VERSION: "29.3.knots20260507"
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: 1maa
          password: ${{ secrets.DOCKER_HUB_PASS }}
      - run: |
          docker buildx imagetools create \
            -t 1maa/bitcoin:v${{ matrix.knots_version }} \
            ghcr.io/bcnbitcoinonly/bitcoin:v${{ matrix.knots_version }}-ubuntu-26.04 \
            ghcr.io/bcnbitcoinonly/bitcoin:v${{ matrix.knots_version }}-ubuntu-26.04-arm
      - if: ${{ matrix.knots_version == env.LATEST_VERSION }}
        run: |
          docker buildx imagetools create \
            -t 1maa/bitcoin:latest \
            1maa/bitcoin:v${{ matrix.knots_version }}

  merge-bip110:
    name: Merge latest BIP-110
    runs-on: ubuntu-latest
    needs:
      - build-bip110
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: 1maa
          password: ${{ secrets.DOCKER_HUB_PASS }}
      - run: |
          docker buildx imagetools create \
            -t 1maa/bitcoin:v29.3.knots20260210-bip110-v0.4.1 \
            ghcr.io/bcnbitcoinonly/bitcoin:v29.3.knots20260210-bip110-v0.4.1-ubuntu-26.04 \
            ghcr.io/bcnbitcoinonly/bitcoin:v29.3.knots20260210-bip110-v0.4.1-ubuntu-26.04-arm

  cleanup:
    name: Cleanup old GHCR tags
    runs-on: ubuntu-latest
    needs:
      - merge
      - merge-bip110
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: bitcoin
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0

  miner:
    name: Build signet miner image from latest Knots version
    runs-on: ubuntu-latest
    needs:
      - merge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: 1maa
          password: ${{ secrets.DOCKER_HUB_PASS }}
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          provenance: false
          push: true
          sbom: false
          targets: miner
